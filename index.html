<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>SimpleChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast" role="status"></div>

  <section id="authView" class="auth-view">
    <div class="auth-card">
      <div class="brand"><span class="brand-mark">S</span>SimpleChat</div>
      <p class="muted">Simple, private messaging.</p>

      <div class="tabs">
        <button id="loginTab" class="tab active" type="button">Login</button>
        <button id="signupTab" class="tab" type="button">Sign up</button>
      </div>

      <form id="loginForm">
        <label for="loginIdentifier">Username or email</label>
        <input id="loginIdentifier" autocomplete="username" required placeholder="username or you@example.com">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••">
        <button class="primary" type="submit">Login</button>
      </form>

      <form id="signupForm" class="hidden">
        <label for="signupUsername">Username</label>
        <input id="signupUsername" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" required placeholder="your_username">
        <small>3–24 characters: letters, numbers and underscore.</small>
        <label for="signupEmail">Email</label>
        <input id="signupEmail" type="email" autocomplete="email" required placeholder="you@example.com">
        <label for="signupPassword">Password</label>
        <input id="signupPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="At least 6 characters">
        <label for="signupDisplayName">Display name</label>
        <input id="signupDisplayName" maxlength="60" placeholder="Your name">
        <button class="primary" type="submit">Create account</button>
      </form>

      <p id="authMessage" class="message"></p>
    </div>
  </section>

  <section id="appView" class="app hidden">
    <div id="layout" class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <div class="me">
            <div id="myAvatar" class="avatar"></div>
            <div class="me-meta">
              <strong id="myDisplay"></strong>
              <span id="myName" class="muted"></span>
            </div>
          </div>
          <div class="sidebar-actions">
            <button id="newChatBtn" class="icon-btn accent" title="New chat" aria-label="New chat">+</button>
            <button id="logoutBtn" class="icon-btn" title="Log out" aria-label="Log out">⎋</button>
          </div>
        </div>
        <div class="search-wrap">
          <input id="chatFilter" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats">
        </div>
        <div id="chatList" class="chat-list" aria-live="polite"></div>
      </aside>

      <section class="chat-panel">
        <div id="welcomePanel" class="welcome">
          <div class="welcome-icon">💬</div>
          <h2>Your messages</h2>
          <p>Pick a chat from the list or start a new one.</p>
          <button id="welcomeNewChat" class="primary">New chat</button>
        </div>

        <div id="conversationPanel" class="conversation hidden">
          <div class="conversation-head">
            <button id="mobileBackBtn" class="mobile-back icon-btn" type="button" aria-label="Back to chats">‹</button>
            <div class="avatar" id="conversationAvatar">?</div>
            <div class="conversation-meta">
              <h2 id="conversationName"></h2>
              <span id="conversationStatus" class="muted"></span>
            </div>
          </div>
          <div class="messages-wrap">
            <div id="messages" class="messages"></div>
            <button id="scrollDownBtn" class="scroll-down hidden" type="button" aria-label="Scroll to latest">↓<span id="scrollBadge" class="badge hidden"></span></button>
          </div>
          <form id="messageForm" class="composer">
            <textarea id="messageInput" rows="1" maxlength="2000" placeholder="Write a message" aria-label="Message"></textarea>
            <button class="primary send" type="submit" aria-label="Send">Send</button>
          </form>
        </div>
      </section>
    </div>
  </section>

  <dialog id="newChatDialog">
    <form method="dialog" id="newChatForm">
      <div class="dialog-head">
        <h3>New chat</h3>
        <button class="icon-btn" value="cancel" type="submit" aria-label="Close">×</button>
      </div>
      <label for="userSearch">Find a person by username</label>
      <input id="userSearch" maxlength="24" placeholder="username" autocomplete="off">
      <div id="userResults" class="user-results"></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
