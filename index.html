<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0866ff">
  <title>SimpleChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="toast" class="toast" role="status"></div>

  <section id="authView" class="auth-view">
    <div class="auth-card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="#fff"><path d="M12 2C6.5 2 2 6.1 2 11.3c0 2.9 1.4 5.4 3.6 7.1V22l3.3-1.8c1 .3 2 .4 3.1.4 5.5 0 10-4.1 10-9.3S17.5 2 12 2z"/></svg>
      </div>
      <h1 id="authTitle">Welcome back</h1>
      <p id="authSub" class="muted">Log in to continue your conversations.</p>

      <div class="tabs" role="tablist">
        <button id="loginTab" class="tab active" type="button" role="tab">Log in</button>
        <button id="signupTab" class="tab" type="button" role="tab">Sign up</button>
      </div>

      <form id="loginForm">
        <label for="loginIdentifier">Username or email</label>
        <input id="loginIdentifier" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required placeholder="username or you@example.com">
        <label for="loginPassword">Password</label>
        <div class="pw">
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="Your password">
          <button type="button" class="pw-toggle" data-for="loginPassword" aria-label="Show password">Show</button>
        </div>
        <button class="primary cta" type="submit"><span class="cta-text">Log in</span><span class="spinner" aria-hidden="true"></span></button>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <button id="googleLoginBtn" class="google-btn" type="button">
        <span class="google-icon" aria-hidden="true">G</span>
        <span>Continue with Google</span>
      </button>

      <form id="signupForm" class="hidden">
        <label for="signupDisplayName">Full name</label>
        <input id="signupDisplayName" name="name" autocomplete="name" maxlength="60" placeholder="e.g. Raj Patwa">
        <label for="signupUsername">Username</label>
        <input id="signupUsername" name="new-username" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" required placeholder="your_username">
        <small>3–24 characters: letters, numbers and underscore.</small>
        <label for="signupEmail">Email</label>
        <input id="signupEmail" name="email" type="email" autocomplete="email" autocapitalize="none" required placeholder="you@example.com">
        <label for="signupPassword">Password</label>
        <div class="pw">
          <input id="signupPassword" name="new-password" type="password" minlength="6" autocomplete="new-password" required placeholder="At least 6 characters">
          <button type="button" class="pw-toggle" data-for="signupPassword" aria-label="Show password">Show</button>
        </div>
        <button class="primary cta" type="submit"><span class="cta-text">Create account</span><span class="spinner" aria-hidden="true"></span></button>
      </form>

      <p id="authMessage" class="message" role="alert"></p>
    </div>
  </section>

  <section id="appView" class="app hidden">
    <div id="layout" class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <h1>Chats</h1>
          <div class="sidebar-actions">
            <button id="newChatBtn" class="icon-btn" title="New chat" aria-label="New chat">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button id="logoutBtn" class="icon-btn" title="Log out" aria-label="Log out">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            </button>
          </div>
        </div>
        <div class="search-wrap">
          <input id="chatFilter" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats">
        </div>
        <div id="chatList" class="chat-list" aria-live="polite"></div>
        <div class="me">
          <div id="myAvatar" class="avatar sm"></div>
          <div class="me-meta"><strong id="myDisplay"></strong><span id="myName" class="muted"></span></div>
        </div>
      </aside>

      <section class="chat-panel">
        <div id="welcomePanel" class="welcome">
          <div class="logo big" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="#fff"><path d="M12 2C6.5 2 2 6.1 2 11.3c0 2.9 1.4 5.4 3.6 7.1V22l3.3-1.8c1 .3 2 .4 3.1.4 5.5 0 10-4.1 10-9.3S17.5 2 12 2z"/></svg>
          </div>
          <h2>Select a chat</h2>
          <p>Choose a conversation from the list or start a new one.</p>
          <button id="welcomeNewChat" class="primary">New chat</button>
        </div>

        <div id="conversationPanel" class="conversation hidden">
          <div class="conversation-head">
            <button id="mobileBackBtn" class="mobile-back icon-btn" type="button" aria-label="Back to chats">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="avatar" id="conversationAvatar">?</div>
            <div class="conversation-meta">
              <h2 id="conversationName"></h2>
              <span id="conversationStatus" class="muted"></span>
            </div>
          </div>
          <div class="messages-wrap">
            <div id="messages" class="messages"></div>
            <button id="scrollDownBtn" class="scroll-down hidden" type="button" aria-label="Scroll to latest">↓<span id="scrollBadge" class="badge hidden"></span></button>
          </div>
          <form id="messageForm" class="composer">
            <textarea id="messageInput" rows="1" maxlength="2000" placeholder="Aa" aria-label="Message"></textarea>
            <button class="send" type="submit" aria-label="Send message">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3.4 20.4l17.4-8a.5.5 0 0 0 0-.9L3.4 3.6a.5.5 0 0 0-.7.6L5 11l9 1-9 1-2.3 6.8a.5.5 0 0 0 .7.6z"/></svg>
            </button>
          </form>
        </div>
      </section>
    </div>
  </section>

  <dialog id="newChatDialog">
    <form method="dialog" id="newChatForm">
      <div class="dialog-head">
        <h3>New chat</h3>
        <button class="icon-btn" value="cancel" type="submit" aria-label="Close">×</button>
      </div>
      <input id="userSearch" type="search" maxlength="24" placeholder="Search by username" autocomplete="off" autocapitalize="none" aria-label="Search by username">
      <div id="userResults" class="user-results"></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
